cmd_vel:
    type: geometry_msgs/Twist
    vx: 
        min: -1
        max: 1
        to: linear.x
    vy: 
        min: -1
        max: 1
        to: linear.y
    vz: 
        min: -1
        max: 1
        to: linear.z
    wx: 
        min: -1
        max: 1
        to: angular.x
    wy: 
        min: -1
        max: 1
        to: angular.y
    wz: 
        min: -1
        max: 1
        to: angular.z
    angular.x: 1   # if not 0
cmd_pose:
    type: geometry_msgs/Pose
    x: 
        min: -1
        max: 1
        to: position.x
    y: 
        min: -1
        max: 1
        to: position.y
    z: 
        min: -1
        max: 1
        to: position.z
    phi: 
        min: -pi
        max: pi
        to: orientation.roll
    psi: 
        min: -pi
        max: pi
        to: orientation.pitch
    theta: 
        min: -pi
        max: pi
        to: orientation.yaw
        
